name: Build and push images

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_images:
    name: Build images
    permissions:
      contents: read
    uses: $/.github/workflows/component-build-images.yml
    with:
      push: true
      force_build: false
      version: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
